# Production: Cortex behind Caddy (automatic HTTPS).
# Usage on the server:
#   DOMAIN=<your-ip>.sslip.io docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    # Pull the CI-built image (recommended on the small box — no compiling on EC2):
    #   docker compose -f docker-compose.prod.yml pull app && ... up -d
    # `build: .` is kept as a fallback so you can still build locally with
    # `... up -d --build`. The `image:` name is also the tag a local build produces.
    image: ghcr.io/anshace/cortex:latest
    build: .
    restart: unless-stopped
    environment:
      - SQLITE_URI=sqlite:///data/authpad.db
      - SEED_FILE=/seed/seed_users.json
      - COOKIE_SECURE=1
      - RUST_LOG=info
      # AI assistant: optional. Set ANTHROPIC_API_KEY in the host environment (or a
      # .env file next to this compose file) to enable it; unset = feature hidden.
      # AI_MODEL defaults to claude-opus-5; override for cost (e.g. claude-haiku-4-5).
      # AI_KEY_SECRET enables storing per-user/org keys in the UI (encrypts them).
      - AI_KEY_SECRET=${AI_KEY_SECRET:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-claude-opus-5}
      # Optional: put seed users in .env as SEED_USERS (raw JSON) instead of the file.
      - SEED_USERS=${SEED_USERS:-}
    volumes:
      - cortex-data:/data
      # Mounted in its own dir (not under /data) so it doesn't collide with the
      # data volume. Must be world-readable on the host (see DEPLOY.md).
      - ./seed_users.json:/seed/seed_users.json:ro
    # No published ports: only Caddy can reach it, over the compose network.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. 3.7.45.21.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  cortex-data:
  caddy-data:
  caddy-config:
